  :root{
    --bg: #e9e9e9;
    --paper: #fbfaf7;
    --ink: #16140f;
    --ink-soft: #4a473f;
    --black: #0a0a0a;
    --black-2: #131313;
    --gold: #c9a24a;
    --green: #3ecf8e;
    --red: #e0575a;
    --line: rgba(10,10,10,0.12);
    --radius: 22px;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, "Noto Naskh Arabic", serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- top grid ---------- */
  .hero{
    display: grid;
    grid-template-columns: 0.82fr 1.18fr;
    gap: 18px;
  }

  @media (max-width: 860px){
    .hero{ grid-template-columns: 1fr; }
  }

  .card{
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* left panel */
  .panel-brand{
    background: var(--paper);
    padding: 40px 38px 34px;
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 460px;
    border: 1px solid var(--line);
    font-family: "Apple Garamond Light Italic", "Iowan Old Style", Georgia, serif;
  }

  .mark{
    width: 74px; height: 74px;
    display: block;
    object-fit: contain;
  }

  .brand-copy{ margin-top: 46px; }
  .brand-copy .line{
    font-family: "Creato Display", "Iowan Old Style", Georgia, serif;
    font-size: clamp(2.6rem, 6.2vw, 3.6rem);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-style: normal;
    font-weight: 400;
  }
  .brand-copy .line.time{
    font-style: normal;
    color: var(--ink);
  }
  .brand-copy .line + .line{ margin-top: 2px; }

  .brand-foot{
    margin-top: 34px;
    font-family: "Creato Display", "Iowan Old Style", Georgia, serif;
    font-size: 0.9rem;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    direction: ltr; text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .icon-group{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .x-link{
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--black);
    color: #fff;
    transition: opacity 0.15s ease;
  }
  .x-link:hover{ opacity: 0.75; }

  /* right panel: chart */
  .panel-chart{
    background: var(--black);
    border: 1px solid #000;
    display:flex;
    flex-direction: column;
    min-height: 460px;
  }

  .chart-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px 8px;
    direction: ltr; text-align:left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #d9d7cf;
    font-size: 0.72rem;
  }
  .chart-head .pair{ display:flex; align-items:center; gap:8px; color:#f2f1ec; font-size:0.8rem;}
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow: 0 0 0 0 rgba(62,207,142,0.6); animation: pulse 1.8s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(62,207,142,0.55);}
    70%{ box-shadow: 0 0 0 8px rgba(62,207,142,0);}
    100%{ box-shadow: 0 0 0 0 rgba(62,207,142,0);}
  }
  .chart-head .open-link{
    color: #9c9a92;
    text-decoration: none;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    transition: color 0.15s ease;
  }
  .chart-head .open-link:hover{ color: #f2f1ec; }

  .chart-body{ flex:1; position:relative; padding: 0 10px 10px; }
  .chart-body iframe{
    width: 100%;
    height: 100%;
    min-height: 380px;
    border: 0;
    border-radius: 12px;
  }
  .chart-empty{
    position: absolute;
    inset: 0 10px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: #79776f;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    border: 1px dashed rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 24px;
  }
  .chart-empty code{
    color: #c9a24a;
    background: rgba(201,162,74,0.12);
    padding: 1px 6px;
    border-radius: 5px;
  }

  /* ---------- bottom bars ---------- */
  .bar{
    margin-top: 14px;
    border-radius: var(--radius);
    background: var(--black);
    color: #f2f1ec;
  }

  .ca-bar{
    padding: 20px 26px;
    display:flex;
    align-items:center;
    justify-content: flex-start;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .ca-row{
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 10px;
    max-width: 100%;
    min-width: 0;
  }
  .ca-bar .ca-label{
    flex: none;
    font-family: "Creato Display", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    color: #9c9a92;
    direction: ltr;
  }
  .ca-bar .ca-value{
    font-family: "Creato Display", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(0.82rem, 2.4vw, 0.98rem);
    color: #f2f1ec;
    direction: ltr;
    white-space: normal;
    word-break: break-all;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .ca-bar:hover .ca-value{ color: var(--gold); }
  .ca-bar{ transition: background 0.15s ease; }
  .ca-bar:hover{ background: #161616; }

  .countdown-bar{
    text-align: center;
    padding: 30px 20px 34px;
  }
  .countdown-bar .cd-label{
    font-family: "Creato Display", "Iowan Old Style", Georgia, serif;
    font-style: normal;
    font-size: 1.05rem;
    color: #d9d7cf;
    margin-bottom: 10px;
  }
  .countdown-bar .cd-clock{
    font-family: "Creato Display", "Iowan Old Style", Georgia, serif;
    font-size: clamp(2.4rem, 8vw, 3.4rem);
    letter-spacing: 0.02em;
    color: #f5f4ef;
    direction: ltr;
    font-variant-numeric: tabular-nums;
  }

  .toast{
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fbfaf7;
    padding: 10px 18px;
    border-radius: 999px;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

      openLink.style.display = 'none';
      pairLabel.textContent = 'NO CHART SET';
    }
  })();

  // ---------- Copy contract address ----------
  const CA = "PASTE_YOUR_CONTRACT_reza_HERE";
  document.getElementById('caValue').textContent = CA;
  const caBar = document.getElementById('caBar');
  const toast = document.getElementById('toast');
  function copyCA(){
    navigator.clipboard?.writeText(CA).catch(()=>{});
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1400);
  }
  caBar.addEventListener('click', copyCA);
  caBar.addEventListener('keypress', e=>{ if(e.key==='Enter') copyCA(); });

  // ---------- Time remaining until next 9:30 AM ET launch (counts DOWN) ----------
  const cdEl = document.getElementById('countdown');
  function timeUntilNextLaunchET(){
    const now = new Date();
    // Get current time in New York
    const nyString = now.toLocaleString('en-US', { timeZone: 'America/New_York' });
    const nyNow = new Date(nyString);
    const target = new Date(nyNow);
    target.setHours(9,30,0,0);
    if(nyNow >= target){ target.setDate(target.getDate()+1); } // already past 9:30 -> aim for tomorrow
    const diffMs = target - nyNow;
    return diffMs;
  }
  function tick(){
    let diff = timeUntilNextLaunchET();
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const pad = n => String(n).padStart(2,'0');
    cdEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  tick();
  setInterval(tick, 1000);
</script>
