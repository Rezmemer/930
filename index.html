  :root{
    --bg: #e7e5e0;
    --paper: #fbfaf7;
    --ink: #16140f;
    --ink-soft: #4a473f;
    --black: #0a0a0a;
    --black-2: #131313;
    --gold: #c9a24a;
    --green: #3ecf8e;
    --red: #e0575a;
    --line: rgba(10,10,10,0.12);
    --radius: 22px;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, "Noto Naskh Arabic", serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- top grid ---------- */
  .hero{
    display: grid;
    grid-template-columns: 0.82fr 1.18fr;
    gap: 18px;
  }

  @media (max-width: 860px){
    .hero{ grid-template-columns: 1fr; }
  }

  .card{
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* left panel */
  .panel-brand{
    background: var(--paper);
    padding: 40px 38px 34px;
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 460px;
    border: 1px solid var(--line);
    font-family: "Apple Garamond Light Italic", "Iowan Old Style", Georgia, serif;
  }

  .mark{
    width: 74px; height: 74px;
    display: block;
    object-fit: contain;
  }

  .brand-copy{ margin-top: 46px; }
  .brand-copy .line{
    font-size: clamp(2.6rem, 6.2vw, 3.6rem);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-style: italic;
    font-weight: 400;
  }
  .brand-copy .line.time{
    font-style: normal;
    color: var(--ink);
  }
  .brand-copy .line + .line{ margin-top: 2px; }

  .brand-foot{
    margin-top: 34px;
    font-family: "Apple Garamond Light Italic", "Iowan Old Style", Georgia, serif;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    direction: ltr; text-align: left;
  }

  /* right panel: chart */
  .panel-chart{
    background: var(--black);
    border: 1px solid #000;
    display:flex;
    flex-direction: column;
    min-height: 460px;
  }

  .chart-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px 8px;
    direction: ltr; text-align:left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #d9d7cf;
    font-size: 0.72rem;
  }
  .chart-head .pair{ display:flex; align-items:center; gap:8px; color:#f2f1ec; font-size:0.8rem;}
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow: 0 0 0 0 rgba(62,207,142,0.6); animation: pulse 1.8s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(62,207,142,0.55);}
    70%{ box-shadow: 0 0 0 8px rgba(62,207,142,0);}
    100%{ box-shadow: 0 0 0 0 rgba(62,207,142,0);}
  }
  .chart-head .open-link{
    color: #9c9a92;
    text-decoration: none;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    transition: color 0.15s ease;
  }
  .chart-head .open-link:hover{ color: #f2f1ec; }

  .chart-body{ flex:1; position:relative; padding: 0 10px 10px; }
  .chart-body iframe{
    width: 100%;
    height: 100%;
    min-height: 380px;
    border: 0;
    border-radius: 12px;
  }
  .chart-empty{
    position: absolute;
    inset: 0 10px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: #79776f;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    border: 1px dashed rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 24px;
  }
  .chart-empty code{
    color: #c9a24a;
    background: rgba(201,162,74,0.12);
    padding: 1px 6px;
    border-radius: 5px;
  }

  /* ---------- bottom bars ---------- */
  .bar{
    margin-top: 14px;
    border-radius: var(--radius);
    background: var(--black);
    color: #f2f1ec;
  }

  .ca-bar{
    padding: 20px 26px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .ca-bar .ca-label{
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: #9c9a92;
    direction: ltr;
  }
  .ca-bar .ca-value{
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(0.78rem, 2.4vw, 0.95rem);
    color: #f2f1ec;
    direction: ltr;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ca-bar .copy-pill{
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.7rem;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.22);
    color: #f2f1ec;
    transition: background 0.15s ease, border-color 0.15s ease;
    direction: ltr;
  }
  .ca-bar:hover .copy-pill{ background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }

  .countdown-bar{
    text-align: center;
    padding: 30px 20px 34px;
  }
  .countdown-bar .cd-label{
    font-style: italic;
    font-size: 1.05rem;
    color: #d9d7cf;
    margin-bottom: 10px;
  }
  .countdown-bar .cd-clock{
    font-size: clamp(2.4rem, 8vw, 3.4rem);
    letter-spacing: 0.02em;
    color: #f5f4ef;
    direction: ltr;
    font-variant-numeric: tabular-nums;
  }

  .toast{
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fbfaf7;
    padding: 10px 18px;
    border-radius: 999px;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
  // ---------- DexScreener chart embed ----------
  // 👉 EVERY DAY: replace the link below with your newly-launched token's
  //    DexScreener pair page URL (the normal one you'd open in a browser,
  //    e.g. "https://dexscreener.com/ethereum/0xabc123..."). Save the file
  //    and re-upload — that's the only edit needed.
  const DEXSCREENER_URL = "https://dexscreener.com/solana/9bn7pwomj6yknz1zs11nxx44yly6gidxgdnxdfdrpump";

  // Optional: you can also override per-visit by adding ?pair=<url> to the
  // page's own address, without touching the file at all.
  const params = new URLSearchParams(window.location.search);
  const pairUrl = params.get('pair') || DEXSCREENER_URL;

  function toEmbedUrl(url){
    try{
      const u = new URL(url);
      u.search = ''; // drop any existing query params
      const embedParams = new URLSearchParams({
        embed: '1',
        theme: 'dark',
        trades: '0',
        info: '0',
        tabs: '0',
        chartLeftToolbar: '0'
      });
      return `${u.toString()}?${embedParams.toString()}`;
    }catch(e){
      return null;
    }
  }

  (function setupChart(){
    const frame = document.getElementById('dexFrame');
    const empty = document.getElementById('chartEmpty');
    const openLink = document.getElementById('openLink');
    const pairLabel = document.getElementById('pairLabel');

    const embedSrc = pairUrl ? toEmbedUrl(pairUrl) : null;

    if(embedSrc){
      frame.src = embedSrc;
      frame.style.display = 'block';
      empty.style.display = 'none';
      openLink.href = pairUrl;
      openLink.style.display = 'inline';
      try{
        const parts = new URL(pairUrl).pathname.split('/').filter(Boolean);
        pairLabel.textContent = parts[0] ? `LIVE · ${parts[0].toUpperCase()}` : 'LIVE CHART';
      }catch(e){ pairLabel.textContent = 'LIVE CHART'; }
    } else {
      frame.style.display = 'none';
      empty.style.display = 'flex';
      openLink.style.display = 'none';
      pairLabel.textContent = 'NO CHART SET';
    }
  })();

  // ---------- Copy contract address ----------
  const CA = "PASTE_YOUR_CONTRACT_ADDRESS_HERE";
  document.getElementById('caValue').textContent = CA;
  const caBar = document.getElementById('caBar');
  const toast = document.getElementById('toast');
  function copyCA(){
    navigator.clipboard?.writeText(CA).catch(()=>{});
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1400);
  }
  caBar.addEventListener('click', copyCA);
  caBar.addEventListener('keypress', e=>{ if(e.key==='Enter') copyCA(); });

  // ---------- Elapsed time since 9:30 AM ET (counts UP, resets next day at 9:30) ----------
  const cdEl = document.getElementById('countdown');
  function elapsedSinceLaunchET(){
    const now = new Date();
    // Get current time in New York
    const nyString = now.toLocaleString('en-US', { timeZone: 'America/New_York' });
    const nyNow = new Date(nyString);
    const launch = new Date(nyNow);
    launch.setHours(9,30,0,0);
    if(nyNow < launch){ launch.setDate(launch.getDate()-1); } // before 9:30 -> still counting from yesterday's launch
    const diffMs = nyNow - launch;
    return diffMs;
  }
  function tick(){
    let diff = elapsedSinceLaunchET();
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const pad = n => String(n).padStart(2,'0');
    cdEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  tick();
  setInterval(tick, 1000);
</script>
